name: Build Telegram iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build Telegram IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          # Use default or latest installed Xcode on macos-14 runner
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv /Users/Shared/$(basename "$GITHUB_WORKSPACE") /Users/Shared/telegram-ios

      - name: Build the App (Fake Codesigning for LiveContainer / TrollStore)
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

          # Import self-signed certs from fake-codesigning
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # Run build with fake codesigning and override Xcode version checks
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # Collect IPA
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [ -f "$f" ]; then
              cp "$f" "$OUTPUT_PATH/Telegram.ipa"
              break
            fi
          done

          if [ ! -f "$OUTPUT_PATH/Telegram.ipa" ]; then
            # Check bazel-bin directly if applebin directory varies
            find bazel-bin -name "Telegram.ipa" -exec cp {} "$OUTPUT_PATH/Telegram.ipa" \;
          fi

          ls -lh "$OUTPUT_PATH/Telegram.ipa"

      - name: Upload Telegram IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-LiveContainer-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          tag_name: ${{ github.ref_name }}
